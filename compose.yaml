services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: handoff_admin
      POSTGRES_PASSWORD: handoff_local_admin
      POSTGRES_DB: handoff
    ports:
      - '127.0.0.1:55440:5432'
    volumes:
      - handoff_pg:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U handoff_admin -d handoff']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  handoff_pg:
